stages:
  - test+checks
  - documentation

# See https://gitlab.com/neil.butcher/dockerimageupload for the definition
image: ergoregion/cpp_build_tools:1.0.0

test+coverage:
  stage: test+checks
  script:
#build
    - conan install . --build=missing --output-folder=out
    - cmake . -DCMAKE_TOOLCHAIN_FILE=/out/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DVersionSubstring=${CI_COMMIT_TAG}
    - cmake --build .
#test
    - ctest --output-on-failure
#coverage report
    - lcov -d . -c -o coverage.info
    - lcov -r coverage.info */c++/* */gcc/* */tests/* */gtest/* */eigen3/* -o coverageFiltered.info
    - genhtml coverageFiltered.info --output-directory html_coverage
    - lcov --list coverageFiltered.info
  coverage: '/Total:\|\s?\d+.\d+%/'
  artifacts:
    expire_in: 1 hour
    paths:
      - ./html_coverage/*
    
error-detection-cppcheck:
    stage: test+checks
    allow_failure: false
    script:
      - cppcheck src --error-exitcode=1 
      
lint-clang-format:
    stage: test+checks
    allow_failure: false
    script:
      - find src -iname *.h -o -iname *.cpp | xargs clang-format -i --dry-run -Werror


doxygen:
    image: alpine
    stage: documentation
    script:
        - apk update
        - apk add doxygen
        - doxygen doxygen/Doxyfile
    artifacts:
        paths:
        - doxygen/documentation/html/
